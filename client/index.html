<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>MEMOPYK</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLRWHE1HV4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Check for developer mode and mark traffic accordingly
      (function () {
        var isDev = /[?#&]ga_dev=1\b/.test(location.href) || localStorage.getItem('ga_dev') === '1';
        window.GA_DEV = isDev;
        gtag('config', 'G-JLRWHE1HV4', {
          send_page_view: true,
          debug_mode: isDev
        });
        
        // Show visual indicator when in test mode - matches bookmarklet styling
        if (isDev) {
          var banner = document.createElement('div');
          banner.id = 'ga-test-banner';
          banner.textContent = '🧪 GA TEST MODE ACTIVE';
          banner.style.cssText = 'position:fixed;bottom:12px;right:12px;background:#ff9800;color:#fff;padding:8px 12px;font:600 13px/1.2 system-ui,Segoe UI,Roboto,Arial;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:2147483647;';
          document.body.appendChild(banner);
        }
      })();
    </script>

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "t3uv5yndxl");

        // Simple consent call that triggers after Clarity is loaded (for testing)
        window.addEventListener('load', function() {
            // Wait for Clarity to be fully loaded before granting consent
            var checkClarity = setInterval(function() {
                if (window.clarity && typeof window.clarity === 'function') {
                    clearInterval(checkClarity);
                    console.log('🔍 Granting Clarity consent using proper API...');
                    // Use the correct Clarity Consent API v2 format
                    window.clarity('consent', {
                        analytics_storage: 'granted',
                        ad_storage: 'denied'  // Change to 'granted' if you want Microsoft Ads integration
                    });
                    
                    // Also try the older legacy format for backward compatibility
                    console.log('🔍 Also trying legacy consent format...');
                    window.clarity('consent', true);
                    // Send a test event to trigger data collection
                    console.log('🔍 Sending test event to trigger dashboard access...');
                    try {
                        window.clarity('event', 'page_load');
                        window.clarity('set', 'user_id', 'test_user_' + Date.now());
                        console.log('✅ Test events sent successfully');
                    } catch (e) {
                        console.log('❌ Error sending events:', e);
                    }
                    
                    // Verify consent was accepted
                    setTimeout(function() {
                        console.log('🍪 Clarity cookies after consent:', document.cookie.match(/_clck|_clsk/));
                        console.log('🔍 Full cookie string:', document.cookie);
                        
                        // Test if we can set any cookies at all
                        document.cookie = 'test_cookie=working; path=/';
                        console.log('🧪 Test cookie set, checking:', document.cookie);
                        
                        // Check Clarity internals
                        console.log('🔍 Clarity internals:', {
                            clarityExists: !!window.clarity,
                            clarityType: typeof window.clarity,
                            userAgent: navigator.userAgent.substring(0, 50),
                            protocol: window.location.protocol,
                            hostname: window.location.hostname
                        });
                        
                        // Try to force a page view event
                        if (window.clarity) {
                            window.clarity('identify', 'memopyk_test_session');
                            console.log('🎯 Sent identify event to Clarity');
                            
                            // Try to manually trigger data collection
                            window.clarity('upgrade', 'auto');
                        }
                    }, 2000);
                }
            }, 100);
        });
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
